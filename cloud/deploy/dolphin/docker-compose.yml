# Dolphin self-hosted services for one VPS. Build context is cloud/.
#   cp .env.example .env && edit it, then: docker compose up -d --build
services:
  caddy:
    build:
      context: ../../../docs/landing-site
      dockerfile: ../../cloud/deploy/dolphin/landing/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOLPHIN_DOMAIN: ${DOLPHIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The marketing site is baked into the image; these app feeds are served beside it.
      - ./site/docs:/srv/site/docs:ro
      - ./site/whats-new:/srv/site/whats-new:ro
      - ./site/plugins:/srv/site/plugins:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - auth
      - relay
      - push

  auth:
    build:
      context: ../..
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    environment:
      DOLPHIN_AUTH_ISSUER: https://auth.${DOLPHIN_DOMAIN}
      # admin: registering an Azure DevOps org needs a Project Collection Administrator PAT.
      # member is for development only; the service refuses to start with it in production.
      AZDO_ORG_PROOF: ${AZDO_ORG_PROOF:-admin}
    volumes:
      - auth-data:/data

  relay:
    build:
      context: ../..
      dockerfile: apps/relay/Dockerfile
    restart: unless-stopped
    environment:
      DOLPHIN_RELAY_ROLE: combined
      DOLPHIN_RELAY_PUBLIC_URL: https://relay.${DOLPHIN_DOMAIN}
      DOLPHIN_RELAY_CELL_URL: https://relay.${DOLPHIN_DOMAIN}
      DOLPHIN_RELAY_AUTH_ISSUER: https://auth.${DOLPHIN_DOMAIN}
      DOLPHIN_RELAY_JWKS_URL: https://auth.${DOLPHIN_DOMAIN}/.well-known/jwks.json
      DOLPHIN_RELAY_ASSIGNMENT_SIGNING_KEY: ${RELAY_ASSIGNMENT_SIGNING_KEY}
      # Required by the schema; only used by GCP admin routes, which this deployment never calls.
      DOLPHIN_RELAY_ADMIN_AUDIENCE: https://relay.${DOLPHIN_DOMAIN}/admin
      DOLPHIN_RELAY_DEPLOY_SERVICE_ACCOUNT: unused@${DOLPHIN_DOMAIN}
      DOLPHIN_RELAY_DATA_DIR: /data
    volumes:
      - relay-data:/data

  # Android push via FCM. firebase-sa.json is the dolphin-cloud-cf4ca service-account key, placed
  # beside this file on the VPS (never committed).
  push:
    build:
      context: ../..
      dockerfile: apps/push/Dockerfile
    restart: unless-stopped
    environment:
      DOLPHIN_PUSH_PUBLIC_URL: https://push.${DOLPHIN_DOMAIN}
      DOLPHIN_PUSH_FCM_PROJECT_ID: dolphin-cloud-cf4ca
      DOLPHIN_PUSH_DATA_DIR: /data
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-sa.json
    volumes:
      - push-data:/data
      - ./firebase-sa.json:/run/secrets/firebase-sa.json:ro

volumes:
  caddy-data:
  caddy-config:
  auth-data:
  relay-data:
  push-data:
