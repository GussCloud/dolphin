name: CI cache warm-up

# Why: a pull request can only restore caches saved on its own ref or on main, and nothing else
# on main installs the apt sets or compiles the native modules the PR lanes need. Without this,
# every PR re-downloads apt packages from a mirror that has taken 20-45 minutes on bad days, and
# every Windows package job spends ~90s per runtime rebuilding node-pty with node-gyp.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/install-apt-packages/**'
      - '.github/actions/install-node-dependencies/**'
      - 'config/scripts/ci-apt-package-sets.mjs'
      - 'config/scripts/ensure-native-runtime.mjs'
      - 'config/scripts/rebuild-native-deps.mjs'
      - 'config/patches/**'
      - 'native/windows-registry/**'
      - 'pnpm-lock.yaml'
  # Unused caches expire after 7 days and runner images roll about weekly.
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ci-cache-warmup.yml'
      - '.github/actions/install-apt-packages/**'
      - 'config/scripts/ci-apt-package-sets.mjs'

permissions:
  contents: read

concurrency:
  group: ci-cache-warmup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: discover apt package sets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sets: ${{ steps.sets.outputs.sets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies

      - name: Collect install-apt-packages invocations
        id: sets
        run: node config/scripts/ci-apt-package-sets.mjs | tee -a "$GITHUB_OUTPUT"

  warm:
    name: warm apt ${{ matrix.playwright-browser || matrix.packages }}
    needs: discover
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.sets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Only the Playwright set resolves its packages through node_modules.
      - uses: ./.github/actions/install-node-dependencies
        if: matrix.playwright-browser != ''

      # A slow mirror is this job's whole cost; let it finish so PR lanes do not pay it.
      - uses: ./.github/actions/install-apt-packages
        with:
          packages: ${{ matrix.packages }}
          playwright-browser: ${{ matrix.playwright-browser }}
          no-install-recommends: ${{ matrix.no-install-recommends }}
          timeout-seconds: '3000'

  # Mirrors the native-runtime installs of the PR lanes; the composite saves each ABI under the
  # same key those lanes restore, including package (windows)'s hand-written Electron key.
  warm-native:
    name: warm native ${{ matrix.runner }} ${{ matrix.native-runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, native-runtime: node, node-version: '' }
          - { runner: ubuntu-latest, native-runtime: electron, node-version: '' }
          - { runner: ubuntu-24.04-arm, native-runtime: node, node-version: '24' }
          - { runner: windows-2022, native-runtime: node, node-version: '' }
          - { runner: windows-2022, native-runtime: electron, node-version: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: ${{ matrix.native-runtime }}
          node-version: ${{ matrix.node-version }}
