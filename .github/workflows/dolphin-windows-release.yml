name: Dolphin Windows Release

# Why its own workflow: signed releases need SignPath and App tokens this repository does not
# have, so this is the only release path. It builds an unsigned NSIS installer
# under the Dolphin identity (docs/reference/fork-identity.md) and publishes it with the repo's
# own GITHUB_TOKEN, so the in-app updater (pointed at this repo) finds latest.yml beside it.
# The build-mac job adds Developer ID-signed, notarized macOS dmg/zip builds and latest-mac.yml to
# the same release.
#
# Only release-beta.yml (X.Y.Z-rc.N prerelease) and release-promote.yml (X.Y.Z stable) call this;
# see docs/reference/release-process.md. The version is stamped into the checkout, never committed.

on:
  workflow_call:
    inputs:
      version:
        description: Version to release, without the leading v (X.Y.Z or X.Y.Z-rc.N)
        required: true
        type: string
      ref:
        description: Full commit SHA on develop to build
        required: true
        type: string
      prerelease:
        description: Publish as a GitHub prerelease (the rc update channel) instead of the latest stable
        required: true
        type: boolean
      publish:
        description: Publish the draft once every leg uploaded; false leaves it a draft for the caller
        required: false
        default: true
        type: boolean
    outputs:
      tag:
        description: The draft release tag every leg uploaded into
        value: ${{ jobs.draft.outputs.tag }}

permissions:
  contents: read

concurrency:
  group: dolphin-windows-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # Why its own job: every leg uploads into this draft, so with it created up front the four
  # builds run in parallel instead of arm64 and mac waiting on build-win.
  draft:
    if: github.repository == 'GussCloud/dolphin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      REQUESTED_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check the requested version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION#v}"
          echo "TAG=v$VERSION" >>"$GITHUB_ENV"
          echo "tag=v$VERSION" >>"$GITHUB_OUTPUT"
          # Why a draft may be replaced: drafts carry no tag and no users, so one left by a failed
          # run is debris; a published release is never overwritten.
          if is_draft="$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::release v$VERSION is already published; cut a new version instead of overwriting it."
              exit 1
            fi
            echo "Deleting stale draft v$VERSION from an earlier failed run."
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi

      # Why a draft: the atom feed the updater walks hides drafts, so no platform sees the release
      # until the publish job has checked every leg's assets.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          node config/scripts/create-draft-release.mjs "$TAG"
          if [[ -f "docs/releases/$TAG.md" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "docs/releases/$TAG.md"
          fi

  build-win:
    needs: draft
    if: github.repository == 'GussCloud/dolphin'
    # Why windows-2022: windows-latest's VS 2026 image breaks node-gyp native installs.
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TAG: ${{ needs.draft.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Stamp the release version
        shell: bash
        run: node config/scripts/stamp-release-version.mjs desktop "${TAG#v}"

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      # Why retried: electron's postinstall pulls its binary from GitHub release assets, which
      # returns transient 504s.
      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build Windows process-table addon for the relay
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - name: Build app
        shell: bash
        run: pnpm build:release
        env:
          DOLPHIN_REQUIRE_RELAY_NATIVE_ADDONS: 'x64,arm64'
          # Why DOLPHIN_BUILD_IDENTITY and PostHog stay unset: telemetry only transmits for upstream's
          # stable/rc identities, so the fork build stays silent.

      - name: Package Windows installer
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          DOLPHIN_BUILD_COMMIT: ${{ inputs.ref }}
          # Why: ensure-native-runtime just prepared these modules for this host's Electron, so the
          # beforeBuild hook probes them instead of compiling them again (as pr.yml's package job does).
          DOLPHIN_REUSE_PREPARED_NATIVE_RUNTIME: '1'

      # Why assert before publishing: the updater resolves a tag, then fetches latest.yml from it;
      # a release with the installer but no manifest is one updates 404 on.
      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          installer="dist/dolphin-windows-setup.exe"
          for required in "$installer" "$installer.blockmap" dist/latest.yml; do
            if [[ ! -f "$required" ]]; then
              echo "::error::missing $required"
              ls -la dist
              exit 1
            fi
          done
          echo "Packaged:"
          ls -la dist/*.exe dist/*.blockmap dist/latest.yml

      - name: Upload to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            dist/dolphin-windows-setup.exe \
            dist/dolphin-windows-setup.exe.blockmap \
            dist/latest.yml

  # Why a separate installer and manifest instead of one NSIS installer carrying both arches: a
  # combined installer roughly doubles every x64 download, and electron-updater's Windows manifest
  # (latest.yml) has no arch suffix. arm64 publishes latest-arm64.yml beside it, and only arm64
  # builds read it, so x64 installs see exactly the assets they did before.
  build-win-arm64:
    needs: draft
    if: github.repository == 'GussCloud/dolphin'
    # Why a native Arm runner: afterPack boots the packaged daemon and probes node-pty, which a
    # cross-built slice cannot execute on an x64 host.
    runs-on: windows-11-arm
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TAG: ${{ needs.draft.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Stamp the release version
        shell: bash
        run: node config/scripts/stamp-release-version.mjs desktop "${TAG#v}"

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          install: false

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-arm64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-arm64-

      # Why: this job runs node-gyp about nine times and each run spent ~47 s finding Visual Studio
      # through PowerShell on this runner. With VCINSTALLDIR set node-gyp takes the install from the
      # environment, as in a Developer Command Prompt; the values are the ones vcvars would export.
      # Why only a warning: without them node-gyp falls back to its own, slower, detection.
      - name: Tell node-gyp where Visual Studio is
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = $null
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -format json |
              ConvertFrom-Json | Select-Object -First 1
          }
          $sdk = Get-ChildItem (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include') -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } | Select-Object -Last 1
          if (-not $vs -or -not $sdk) {
            Write-Host '::warning::Visual Studio or the Windows SDK was not found where expected; node-gyp will detect them itself.'
            exit 0
          }
          "VCINSTALLDIR=$($vs.installationPath)\VC\" >> $env:GITHUB_ENV
          "VSCMD_VER=$($vs.installationVersion)" >> $env:GITHUB_ENV
          "WindowsSDKVersion=$($sdk.Name)\" >> $env:GITHUB_ENV
          Write-Host "Visual Studio $($vs.installationVersion) at $($vs.installationPath), Windows SDK $($sdk.Name)"

      # Why: node-gyp otherwise downloads and unpacks the Node headers on every run (~1 min here).
      # Why not hashFiles('package.json'): the version stamp above rewrites it for every release.
      - name: Cache node-gyp headers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~\AppData\Local\node-gyp\Cache
          key: node-gyp-headers-win-arm64-${{ steps.node.outputs.node-version }}

      # Why in the background: linking mobile's ~1,360 packages takes 3 min on this runner's disk and
      # uses nothing the root install produces (its own project, lockfile and node_modules), so the
      # two overlap. Both only read the restored pnpm store. Build app waits for it below.
      - uses: ./.github/actions/install-mobile-dependencies
        id: mobile-deps
        background: true

      # Why retried: electron's postinstall pulls its binary from GitHub release assets, which
      # returns transient 504s.
      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - name: Build Windows process-table addon for the relay
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - wait: mobile-deps

      - name: Build app
        shell: bash
        run: pnpm build:release
        env:
          DOLPHIN_REQUIRE_RELAY_NATIVE_ADDONS: 'x64,arm64'

      - name: Package Windows arm64 installer
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --arm64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          DOLPHIN_BUILD_COMMIT: ${{ inputs.ref }}
          DOLPHIN_WIN_ARM64_RELEASE: '1'
          # Why: same as the x64 leg; on this runner each skipped node-gyp run is ~1 min.
          DOLPHIN_REUSE_PREPARED_NATIVE_RUNTIME: '1'

      # Why refuse latest.yml: uploading it would replace x64's manifest and move x64 users onto arm64.
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          installer="dist/dolphin-windows-setup-arm64.exe"
          for required in "$installer" "$installer.blockmap" dist/latest-arm64.yml; do
            if [[ ! -f "$required" ]]; then
              echo "::error::missing $required"
              ls -la dist
              exit 1
            fi
          done
          if grep -q 'dolphin-windows-setup\.exe' dist/latest-arm64.yml; then
            echo "::error::latest-arm64.yml points at the x64 installer"
            exit 1
          fi
          ls -la "$installer" "$installer.blockmap" dist/latest-arm64.yml

      - name: Upload to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            dist/dolphin-windows-setup-arm64.exe \
            dist/dolphin-windows-setup-arm64.exe.blockmap \
            dist/latest-arm64.yml

  # Why Developer ID + notarization: Squirrel.Mac installs an update only when its signature satisfies
  # the running app's designated requirement, so every build must carry the same team identity.
  # Installs from earlier ad-hoc releases carry the unsigned marker and still need one manual .dmg.
  # Why one slice per runner: each slice waits ~5 min on Apple's notary, and a single run notarizes
  # them one after the other; mac-update-manifest joins the two latest-mac.yml files afterwards.
  build-mac:
    name: build-mac (${{ matrix.arch }})
    needs: draft
    if: github.repository == 'GussCloud/dolphin'
    # Why an Arm runner for both: afterPack boots the daemon only on the host-arch slice, and the
    # x64 slice has always been cross-packaged from this runner.
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            app_dir: mac
            zip_suffix: mac.zip
          - arch: arm64
            app_dir: mac-arm64
            zip_suffix: arm64-mac.zip
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TAG: ${{ needs.draft.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Stamp the release version
        shell: bash
        run: node config/scripts/stamp-release-version.mjs desktop "${TAG#v}"

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-mac-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-mac-

      # Why install:release: the x64 slice needs x64 optional native packages an arm64 host skips.
      # Why retried: electron's postinstall pulls its binary from GitHub release assets, which
      # returns transient 504s.
      - name: Install dependencies
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install:release

      - uses: ./.github/actions/install-mobile-dependencies

      # Why no DOLPHIN_REQUIRE_RELAY_NATIVE_ADDONS: the Windows relay addon only builds on Windows, so
      # this app's relay falls back to the PowerShell scan on Windows SSH hosts.
      - name: Build app
        run: pnpm build:release

      # Why the key goes to a file: notarytool takes the App Store Connect key as a path, not a value.
      - name: Package macOS dmg and zip
        run: |
          set -euo pipefail
          umask 077
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_CONTENT" >"$APPLE_API_KEY"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          node config/scripts/verify-macos-release-env.mjs
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          pnpm exec electron-builder --config config/electron-builder.config.cjs --mac --publish never
        env:
          DOLPHIN_BUILD_COMMIT: ${{ inputs.ref }}
          DOLPHIN_MAC_RELEASE: '1'
          DOLPHIN_MAC_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Why not latest-mac.yml: this slice's copy names only its own files, and uploading it would
      # hide the other slice from the updater; mac-update-manifest uploads the merged one.
      - name: Verify and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          APP_DIR: ${{ matrix.app_dir }}
          ZIP_SUFFIX: ${{ matrix.zip_suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg="dist/dolphin-macos-$ARCH.dmg"
          zip="dist/Dolphin-${TAG#v}-$ZIP_SUFFIX"
          for required in "$dmg" "$dmg.blockmap" "$zip" "$zip.blockmap" dist/latest-mac.yml; do
            if [[ ! -f "$required" ]]; then
              echo "::error::missing $required"
              ls -la dist
              exit 1
            fi
          done
          zips=(dist/*-mac.zip)
          apps=(dist/mac*/*.app)
          if (( ${#zips[@]} != 1 || ${#apps[@]} != 1 )) || [[ "${apps[0]}" != "dist/$APP_DIR/"* ]]; then
            echo "::error::expected only the $ARCH build, found ${zips[*]} and ${apps[*]}"
            ls -la dist
            exit 1
          fi
          # Why check notarization here: electron-builder only warns when it skips notarizing, and an
          # unnotarized or ad-hoc build would strand every install on its first auto-update.
          app="${apps[0]}"
          codesign --verify --deep --strict "$app"
          if ! codesign -dvv "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'; then
            echo "::error::$app is not signed with a Developer ID Application certificate"
            exit 1
          fi
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          if [[ -f "$app/Contents/Resources/dolphin-unsigned-mac-release" ]]; then
            echo "::error::$app carries the unsigned-release marker and would refuse updates"
            exit 1
          fi
          files=("$dmg" "$dmg.blockmap" "$zip" "$zip.blockmap")
          ls -la "${files[@]}"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "${files[@]}"

      - name: Hand this slice's update manifest to the merge job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mac-update-manifest-${{ matrix.arch }}
          path: dist/latest-mac.yml
          retention-days: 1
          if-no-files-found: error

  # Why the updater needs this: it reads one latest-mac.yml and picks its slice from it.
  mac-update-manifest:
    needs: [draft, build-mac]
    if: github.repository == 'GussCloud/dolphin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.draft.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Why: the merge script parses the manifests with the repository's yaml package.
      - uses: ./.github/actions/install-node-dependencies

      - name: Download the x64 manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mac-update-manifest-x64
          path: ${{ runner.temp }}/mac-x64

      - name: Download the arm64 manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mac-update-manifest-arm64
          path: ${{ runner.temp }}/mac-arm64

      - name: Merge and upload latest-mac.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node config/scripts/merge-mac-update-manifests.mjs \
            "$RUNNER_TEMP/mac-x64/latest-mac.yml" "$RUNNER_TEMP/mac-arm64/latest-mac.yml" dist/latest-mac.yml
          cat dist/latest-mac.yml
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist/latest-mac.yml

  # Why one publish step for every leg: a release the updater can see must already carry each
  # platform's manifest and installers (verify-release-required-assets), or that platform 404s.
  publish:
    needs: [draft, build-win, build-win-arm64, build-mac, mac-update-manifest]
    if: github.repository == 'GussCloud/dolphin' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: ./.github/actions/publish-desktop-release
        with:
          tag: ${{ needs.draft.outputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          github-token: ${{ github.token }}
