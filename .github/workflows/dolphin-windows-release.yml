name: Dolphin Windows Release

# Why its own workflow: upstream's release-cut and dev-channel legs are gated to stablyai/orca and
# need SignPath and App tokens this fork does not have. This builds an unsigned NSIS installer
# under the Dolphin identity (docs/reference/fork-identity.md) and publishes it with the repo's
# own GITHUB_TOKEN, so the in-app updater (pointed at this repo) finds latest.yml beside it.
#
# Cut a release: bump package.json "version" and merge to main. A main push that lands a version
# with no release yet builds and publishes it; a push tag v<version> or a manual dispatch do too.

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/dolphin-windows-release.yml
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v; must equal package.json
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dolphin-windows-release-${{ inputs.version || github.ref_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-win:
    if: github.repository == 'GussCloud/orca'
    # Why windows-2022: windows-latest's VS 2026 image breaks node-gyp native installs (see
    # dev-channel-win-build.yml).
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      # Why three sources: a dispatch names the version, a tag push carries it in its ref, and a
      # main push releases whatever package.json now says (resolved in the first step).
      REQUESTED_VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the requested version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          packaged="$(node -p "require('./package.json').version")"
          VERSION="${REQUESTED_VERSION#v}"
          VERSION="${VERSION:-$packaged}"
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
          echo "TAG=v$VERSION" >>"$GITHUB_ENV"
          # Why skip rather than fail: most main pushes that touch package.json change deps, not the
          # version, and must not error on a release that already exists.
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/* ]] \
            && gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >>"$GITHUB_OUTPUT"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version '$VERSION' is not semver."
            exit 1
          fi
          if [[ "$packaged" != "$VERSION" ]]; then
            echo "::error::package.json is at $packaged, not $VERSION. Bump it on main first."
            exit 1
          fi

      - name: Setup pnpm
        if: steps.version.outputs.skip != 'true'
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Setup Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Cache electron-builder downloads
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      # Why retried: electron's postinstall pulls its binary from GitHub release assets, which
      # returns transient 504s.
      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies
        if: steps.version.outputs.skip != 'true'

      - name: Build Windows process-table addon for the relay
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - name: Build app
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: pnpm build:release
        env:
          ORCA_REQUIRE_RELAY_NATIVE_ADDONS: 'x64,arm64'
          # Why ORCA_BUILD_IDENTITY and PostHog stay unset: telemetry only transmits for upstream's
          # stable/rc identities, so the fork build stays silent.

      - name: Package Windows installer
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          node config/scripts/ensure-native-runtime.mjs --runtime=electron
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          ORCA_BUILD_COMMIT: ${{ github.sha }}

      # Why assert before publishing: the updater resolves a tag, then fetches latest.yml from it;
      # a release with the installer but no manifest is one updates 404 on.
      - name: Collect release assets
        if: steps.version.outputs.skip != 'true'
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          installer="dist/dolphin-windows-setup.exe"
          for required in "$installer" "$installer.blockmap" dist/latest.yml; do
            if [[ ! -f "$required" ]]; then
              echo "::error::missing $required"
              ls -la dist
              exit 1
            fi
          done
          echo "Packaged:"
          ls -la dist/*.exe dist/*.blockmap dist/latest.yml

      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease || 'false' }}
        run: |
          set -euo pipefail
          flags=(--target "$GITHUB_SHA" --title "Dolphin $TAG")
          if [[ -f "docs/releases/$TAG.md" ]]; then
            flags+=(--notes-file "docs/releases/$TAG.md")
          else
            flags+=(--generate-notes)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; bump the version instead of overwriting it."
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            dist/dolphin-windows-setup.exe \
            dist/dolphin-windows-setup.exe.blockmap \
            dist/latest.yml
