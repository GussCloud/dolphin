name: E2E develop

# The whole e2e suite on develop after every merge, plus twice a day. PRs run only the specs they
# wrote or edited (pr.yml); this run is the regression net for everything else, so a merge that
# breaks another spec is known within the hour, not at the next promote. release-promote.yml runs
# the same suite on the commit it promotes before main may move. A failing run opens or updates
# one issue naming the PRs merged since the last green run; a test that passed only on its retry
# goes into a separate flaky-tests issue instead of failing the run.
#
# Why every job tests needs.decide.outputs.sha, never github.sha: GitHub fires schedules only from
# the default branch (main), where github.sha is main.

on:
  schedule:
    # 03:13 and 13:13 in Brasília (UTC-3): outside working hours, because the suite holds 14 of
    # the 20 concurrent jobs a free account gets (10 shards, 3 Docker-SSH lanes and localhost SSH).
    - cron: '13 6,16 * * *'
  # Why every merge: a regression surfaces right after the PR that caused it. The concurrency
  # group keeps one run going and only the newest merge waiting, so a burst of merges is one queue.
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-develop
  cancel-in-progress: false

jobs:
  decide:
    if: github.repository == 'GussCloud/dolphin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.decide.outputs.sha }}
      last_green: ${{ steps.decide.outputs.last_green }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Why skip: a schedule that finds develop unchanged since the last green run proves nothing new.
      # Why an artifact: a scheduled run's headSha is main's, so only the run itself knows what it tested.
      - name: Skip when develop has not changed since the last green run
        id: decide
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          last_green=""
          green_run="$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e-develop.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // ""')"
          if [[ -n "$green_run" ]] && gh run download "$green_run" -R "$GITHUB_REPOSITORY" \
            -n e2e-develop-green -D green 2>/dev/null; then
            last_green="$(cat green/sha)"
          fi
          echo "last_green=$last_green" >>"$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$last_green" == "$sha" ]]; then
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "develop is still at $sha, which already passed." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

  suite:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.decide.outputs.sha }}
      retries: '1'

  wsl:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/windows-wsl-e2e.yml
    with:
      ref: ${{ needs.decide.outputs.sha }}
      retries: '1'

  # Why its own issue: a retried pass does not fail the run, so without this it would go unseen.
  flaky:
    needs: [decide, suite, wsl]
    if: ${{ always() && needs.decide.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.decide.outputs.sha }}
    steps:
      - name: Collect tests that passed only on retry
        run: |
          set -euo pipefail
          flaky=""
          for job in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[].id'); do
            flaky+="$(gh api --paginate "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" \
              --jq '.[] | select(.title == "Flaky e2e") | "- " + .message' || true)"$'\n'
          done
          flaky="$(printf '%s' "$flaky" | sed '/^$/d' | sort -u)"
          if [[ -z "$flaky" ]]; then
            echo "No flaky tests in this run." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf 'These e2e tests failed once and passed on retry at `%s`:\n\n%s\n\nRun: %s\n' "${SHA:0:10}" "$flaky" "$run_url")"
          printf '%s\n' "$body" >>"$GITHUB_STEP_SUMMARY"
          title="Flaky e2e tests on develop"
          number="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // ""')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  record:
    needs: [decide, suite, wsl]
    if: ${{ needs.suite.result == 'success' && needs.wsl.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the commit that passed
        run: |
          mkdir -p green
          echo "$SHA" >green/sha
        env:
          SHA: ${{ needs.decide.outputs.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-develop-green
          path: green/sha
          retention-days: 90

  report:
    needs: [decide, suite, wsl]
    if: ${{ always() && needs.decide.outputs.run == 'true' && (needs.suite.result == 'failure' || needs.wsl.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      LAST_GREEN: ${{ needs.decide.outputs.last_green }}
      SHA: ${{ needs.decide.outputs.sha }}
      SUITE: ${{ needs.suite.result }}
      WSL: ${{ needs.wsl.result }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Why one issue: a red suite stays red across runs; each run adds a comment, not a new issue.
      - name: Open or update the failure issue
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [[ -n "$LAST_GREEN" ]] && git cat-file -e "$LAST_GREEN^{commit}" 2>/dev/null; then
            suspects="$(git log --merges --format='- %s' "$LAST_GREEN..$SHA" | grep -E '#[0-9]+' || true)"
            since="since the last green run (\`${LAST_GREEN:0:10}\`)"
          else
            suspects=""
            since="(no earlier green run to compare with)"
          fi
          body="$(printf 'The e2e suite failed on develop at `%s`: suite %s, WSL %s.\n\nRun: %s\n\nPRs merged %s:\n%s\n' \
            "${SHA:0:10}" "$SUITE" "$WSL" "$run_url" "$since" "${suspects:-- none found}")"
          title="E2E suite failing on develop"
          number="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // ""')"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
