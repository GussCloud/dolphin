name: Dolphin Android Release

# Builds the Dolphin Mobile APK and publishes it as a GitHub release asset, the Android twin of
# dolphin-windows-release.yml.
#
# Releases come only from release-beta.yml (prerelease mobile-android-vX.Y.Z-rc.N) and
# release-promote.yml (mobile-android-vX.Y.Z); see docs/reference/release-process.md. They stamp
# the version and versionCode into the checkout, so no app.json bump is committed. A manual dispatch
# builds the APK artifact only and never publishes.
#
# Signing: with the ANDROID_KEYSTORE_* secrets set, the APK is re-signed with that key, so each
# release installs over the previous one. Without them it ships Expo's per-runner debug key, and
# Android refuses to update across two such builds (uninstall first).

on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA on develop to build
        required: true
        type: string
      version:
        description: Android versionName to stamp, X.Y.Z
        required: true
        type: string
      android_version_code:
        description: Android versionCode to stamp (config/scripts/next-release-version.mjs)
        required: true
        type: string
      release_tag:
        description: GitHub release tag, mobile-android-vX.Y.Z or mobile-android-vX.Y.Z-rc.N
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease and leave mobile-android-latest on the last stable
        required: true
        type: boolean
      publish_github_release:
        description: Create the GitHub release (and refresh mobile-android-latest for a stable)
        required: false
        default: true
        type: boolean
      shell:
        required: false
        default: native
        type: string
    # Why outputs: release-promote publishes the APK itself, after its e2e suite passes.
    outputs:
      artifact:
        description: Name of the artifact holding the signed APK
        value: ${{ jobs.build-android.outputs.artifact }}
      apk_name:
        description: File name of the APK inside the artifact
        value: dolphin-android.apk
      tag:
        value: ${{ jobs.build-android.outputs.tag }}
      version:
        value: ${{ jobs.build-android.outputs.version }}
      version_code:
        value: ${{ jobs.build-android.outputs.version_code }}
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional mobile version assertion, e.g. 0.0.51; must equal mobile/app.json
        required: false
        type: string
      shell:
        description: 'Which shell the binary mounts: native screens, or the web page delivered over the air.'
        required: false
        default: native
        type: choice
        options:
          - native
          - ota

permissions:
  contents: read

concurrency:
  group: dolphin-android-release-${{ inputs.release_tag || github.ref_name }}-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  APK_NAME: dolphin-android.apk

jobs:
  build-android:
    if: github.repository == 'GussCloud/dolphin'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      artifact: dolphin-android-${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.android_version_code }}

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Stamp the release version
        if: inputs.release_tag
        env:
          VERSION: ${{ inputs.version }}
          VERSION_CODE: ${{ inputs.android_version_code }}
        run: node ../config/scripts/stamp-release-version.mjs mobile "$VERSION" "$VERSION_CODE"

      - name: Resolve release version and version code
        id: release
        env:
          MOBILE_ANDROID_RELEASE_VERSION: ${{ inputs.release_version || inputs.version }}
          # Why release_tag: only release-beta/promote pass it, so a bare dispatch cannot publish.
          MOBILE_ANDROID_PUBLISH_RELEASE: ${{ inputs.release_tag && inputs.publish_github_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/prepare-android-release.mjs
          # Why override: prepare-android-release names stable tags only; an rc carries its own.
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "tag=$RELEASE_TAG" >>"$GITHUB_OUTPUT"
          fi

      # Why before the build: a run that would publish over an existing release fails here instead
      # of after the ~25 min build.
      - name: Skip versions already released
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PUBLISH_RELEASE: ${{ steps.release.outputs.publish_release }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=false" >>"$GITHUB_OUTPUT"
          elif [[ "$PUBLISH_RELEASE" == "true" ]]; then
            echo "::error::release $TAG already exists; cut a new beta instead of overwriting it."
            exit 1
          else
            echo "$TAG exists; building the APK artifact without publishing."
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Setup JDK 17
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      # Why cached: without it every build fetches Gradle and the whole Android dependency graph from
      # Maven Central, which rate-limits shared runners (429 failed the 2026-11-24 beta).
      - name: Cache Gradle downloads
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('mobile/pnpm-lock.yaml') }}
          restore-keys: |
            gradle-android-

      - name: Expo prebuild
        if: steps.gate.outputs.skip != 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK
        if: steps.gate.outputs.skip != 'true'
        env:
          # The build-time constant that decides whether the binary mounts the web page or the
          # native screens.
          EXPO_PUBLIC_MOBILE_SHELL: ${{ inputs.shell || 'native' }}
        run: |
          set -euo pipefail
          echo "Mobile shell: $EXPO_PUBLIC_MOBILE_SHELL"
          cd android
          log="$RUNNER_TEMP/gradle-build.log"
          # Why retry only on a fetch error: a compile error fails the same way twice.
          for attempt in 1 2; do
            # Why arm only: phones are arm64-v8a or armeabi-v7a; x86/x86_64 are emulators and Intel
            # Chromebooks, which the owner chose not to ship to, and they doubled the native compile.
            if ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a 2>&1 | tee "$log"; then
              exit 0
            fi
            if [[ "$attempt" == 2 ]] || ! grep -qE 'status code (429|5[0-9][0-9])|Could not GET|Read timed out' "$log"; then
              exit 1
            fi
            echo "::warning::Gradle could not fetch a dependency (attempt $attempt); retrying in 60s"
            sleep 60
          done

      - name: Sign APK
        if: steps.gate.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          built=android/app/build/outputs/apk/release/app-release.apk
          out="$RUNNER_TEMP/$APK_NAME"
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; publishing a debug-signed APK that cannot update a previous install."
            cp "$built" "$out"
          else
            keystore="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$keystore"
            # Why re-sign instead of a gradle signingConfig: prebuild regenerates build.gradle each run.
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
            "$apksigner" sign \
              --ks "$keystore" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$out" "$built"
            "$apksigner" verify --print-certs "$out"
            rm -f "$keystore"
          fi
          echo "APK_PATH=$out" >>"$GITHUB_ENV"

      - name: Upload APK artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dolphin-android-${{ steps.release.outputs.version }}
          path: ${{ env.APK_PATH }}

      - name: Publish GitHub release
        if: steps.gate.outputs.skip != 'true' && steps.release.outputs.publish_release == 'true'
        uses: ./.github/actions/publish-android-release
        with:
          apk-path: ${{ env.APK_PATH }}
          tag: ${{ steps.release.outputs.tag }}
          version: ${{ steps.release.outputs.version }}
          version-code: ${{ steps.release.outputs.android_version_code }}
          prerelease: ${{ inputs.prerelease }}
          target-sha: ${{ inputs.ref || github.sha }}
          github-token: ${{ github.token }}
