name: CodeQL

# Advisory: results go to the Security tab and nothing here gates merges (the blocking
# security checks are the `security` job in pr.yml).
on:
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
  schedule:
    # Mondays 04:17 UTC, off the top of the hour.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - docs
              - '**/node_modules'
              - out
              - resources
              - '**/__fixtures__'
              - mobile/rpc-foundation/goldens

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
