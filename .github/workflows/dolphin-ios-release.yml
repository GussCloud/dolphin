name: Dolphin iOS Release

# Builds Dolphin Mobile for iOS and uploads it to TestFlight, the iOS twin of
# dolphin-android-release.yml. The internal group "dolphin-internal" has access to all builds, so
# a build reaches its testers as soon as App Store Connect finishes processing it; no beta review.
#
# Releases come only from release-beta.yml (internal TestFlight build) and release-promote.yml
# (which distributes the beta's build to the external TestFlight group once e2e is green, and calls
# this workflow only when that build cannot be reused); see docs/reference/release-process.md. fastlane stamps the version and build number into the
# checkout, so no app.json bump is committed. A manual dispatch still uploads an internal build.
#
# Signing: IOS_DIST_CERT_P12 is the team's Apple Distribution certificate; fastlane fetches the App
# Store provisioning profile with the App Store Connect API key (ASC_*). See mobile/fastlane/Fastfile.

on:
  workflow_call:
    inputs:
      ref:
        description: Full commit SHA on develop to build
        required: true
        type: string
      release_version:
        description: iOS marketing version, X.Y.Z
        required: true
        type: string
      shell:
        required: false
        default: native
        type: string
    # Why outputs: release-promote distributes this exact build to external testers after its e2e.
    outputs:
      version:
        value: ${{ jobs.ios-build.outputs.version }}
      build_number:
        value: ${{ jobs.ios-build.outputs.build_number }}
  workflow_dispatch:
    inputs:
      bump_patch_version:
        description: 'Use the first open iOS patch version after the checked-in version, skipping versions already closed on the App Store.'
        required: false
        default: false
        type: boolean
      release_version:
        description: 'Optional exact iOS marketing version override, e.g. 0.0.15'
        required: false
        type: string
      skip_upload:
        description: 'Build and sign the .ipa without uploading it to App Store Connect (toolchain checks).'
        required: false
        default: false
        type: boolean
      shell:
        description: 'Which shell the binary mounts: native screens, or the web page delivered over the air.'
        required: false
        default: native
        type: choice
        options:
          - native
          - ota

permissions:
  contents: read

concurrency:
  group: dolphin-ios-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ios-build:
    if: github.repository == 'GussCloud/dolphin'
    # Why xcode-27: App Store Connect requires the iOS 27 SDK for uploads from April 2027 (ITMS-90725).
    runs-on: xcode-27
    timeout-minutes: 90
    outputs:
      version: ${{ steps.gate.outputs.version }}
      build_number: ${{ steps.gate.outputs.build_number }}

    env:
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '27.2'

      - name: Setup pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2
        with:
          install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Resolve release version and build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MOBILE_IOS_RELEASE_VERSION: ${{ inputs.release_version }}
          MOBILE_IOS_BUMP_PATCH_VERSION: ${{ inputs.bump_patch_version || false }}
        run: bundle exec fastlane ios prepare_release_version version:"$MOBILE_IOS_RELEASE_VERSION" bump_patch:"$MOBILE_IOS_BUMP_PATCH_VERSION"

      - name: Report the resolved build
        id: gate
        run: |
          set -euo pipefail
          read -r version build_number < <(node -p 'const { expo } = require("./app.json"); `${expo.version} ${expo.ios.buildNumber}`')
          echo "Dolphin Mobile iOS $version ($build_number)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "build_number=$build_number" >>"$GITHUB_OUTPUT"
          echo "skip=false" >>"$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild
        if: steps.gate.outputs.skip != 'true'
        env:
          # Why: app.config.js writes this into aps-environment; release builds register production tokens.
          DOLPHIN_IOS_APS_ENVIRONMENT: production
        run: npx expo prebuild --platform ios --no-install

      # Why ccache: React Native is built from source (its native patch needs it), ~1,800 files on
      # every run; ccache reuses them while the native code is unchanged. CI only, so local builds
      # keep their own setting; pod install reads apple.ccacheEnabled, so this comes first.
      - name: Enable ccache for the native build
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          brew install ccache
          node -e "const f='ios/Podfile.properties.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f,'utf8'));p['apple.ccacheEnabled']='true';fs.writeFileSync(f,JSON.stringify(p,null,2)+'\\n')"
          echo "CCACHE_DIR=$HOME/.ccache-dolphin-ios" >>"$GITHUB_ENV"

      - name: Restore the native build cache
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.ccache-dolphin-ios
          key: ccache-ios-${{ hashFiles('mobile/pnpm-lock.yaml', 'mobile/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            ccache-ios-${{ hashFiles('mobile/pnpm-lock.yaml', 'mobile/patches/**') }}-
            ccache-ios-

      - name: Install CocoaPods
        if: steps.gate.outputs.skip != 'true'
        run: npx pod-install ios

      # Why a throwaway keychain: the API key can fetch provisioning profiles but not the
      # certificate's private key, which only the .p12 carries.
      - name: Import distribution certificate
        if: steps.gate.outputs.skip != 'true'
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/dolphin-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/dolphin-dist-cert.p12"
          umask 077
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode >"$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution:'; then
            echo "::error::IOS_DIST_CERT_P12 holds no valid Apple Distribution identity"
            exit 1
          fi

      - name: Build and upload to TestFlight
        if: steps.gate.outputs.skip != 'true'
        env:
          # React Native's recommended settings for ccache with Xcode (clang index store, PCH, modules).
          CCACHE_SLOPPINESS: clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros
          CCACHE_FILECLONE: 'true'
          CCACHE_DEPEND: 'true'
          CCACHE_INODECACHE: 'true'
          CCACHE_MAXSIZE: 3G
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_PUBLIC_MOBILE_SHELL: ${{ inputs.shell || 'native' }}
          SKIP_UPLOAD: ${{ inputs.skip_upload || false }}
        run: |
          set -euo pipefail
          echo "Mobile shell: $EXPO_PUBLIC_MOBILE_SHELL"
          bundle exec fastlane ios build_and_upload skip_upload:"$SKIP_UPLOAD"

      # Why: the hit rate is how the next run proves the cache works; it never fails the build.
      - name: Report the native build cache
        if: always() && steps.gate.outputs.skip != 'true'
        run: ccache --show-stats || true

      - name: Upload .ipa artifact
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dolphin-mobile-ipa
          path: mobile/build/*.ipa
          if-no-files-found: ignore
