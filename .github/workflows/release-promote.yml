name: Release Promote

# Promotes a published beta to the official release; docs/reference/release-process.md is the
# operator guide. After approval in the `production` environment it rebuilds THE SAME COMMIT the rc
# tag points at, versioned X.Y.Z, while the full e2e suite runs; nothing is published until it passes:
# Desktop: vX.Y.Z, the latest stable GitHub release the in-app updater serves.
# Mobile: APK as mobile-android-vX.Y.Z (and mobile-android-latest), and an iOS build distributed to
# the external TestFlight group. App Store review submission stays manual.
# Once published, main is moved to the promoted commit: main is what was released.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to promote
        required: true
        default: both
        type: choice
        options:
          - desktop
          - mobile
          - both
      desktop_rc_tag:
        description: Desktop rc tag to promote, e.g. v0.2.56-rc.2 (latest = newest published rc)
        required: false
        default: latest
        type: string
      mobile_rc_tag:
        description: Mobile rc tag to promote, e.g. mobile-android-v0.0.66-rc.1 (latest = newest published rc)
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'GussCloud/dolphin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      desktop_version: ${{ steps.desktop.outputs.version }}
      desktop_sha: ${{ steps.desktop_commit.outputs.sha }}
      mobile_version: ${{ steps.mobile.outputs.marketing_version }}
      mobile_tag: ${{ steps.mobile.outputs.tag }}
      android_version_code: ${{ steps.mobile.outputs.android_version_code }}
      mobile_sha: ${{ steps.mobile_commit.outputs.sha }}
      target_sha: ${{ steps.target.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Why full history: promotion-commit diffs the rc commit against develop head.
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the desktop release
        id: desktop
        if: inputs.app != 'mobile'
        env:
          RC_TAG: ${{ inputs.desktop_rc_tag || 'latest' }}
        run: node config/scripts/next-release-version.mjs desktop --promote "$RC_TAG"

      # Why the PR's checks: the rc was cut without them, and promote is the gate that requires them.
      - name: Check the desktop rc commit
        id: desktop_commit
        if: inputs.app != 'mobile'
        env:
          RC_TAG: ${{ steps.desktop.outputs.rc_tag }}
        run: |
          set -euo pipefail
          rc_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RC_TAG" --jq .sha)"
          # Why develop head when allowed: a tests- or CI-only merge cuts no rc, so the rc commit would
          # run stale tests against the same app.
          sha="$(GITHUB_OUTPUT=/dev/null node config/scripts/beta-release-scope.mjs --promotion-commit desktop "$rc_sha" "$(git rev-parse HEAD)" | sed -n 's/^sha=//p')"
          [[ "$sha" != "$rc_sha" ]] && echo "Nothing desktop ships changed since $RC_TAG; promoting develop head $sha."
          node config/scripts/verify-release-commit.mjs "$sha" --branch develop --require-checks
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Resolve the mobile release
        id: mobile
        if: inputs.app != 'desktop'
        env:
          RC_TAG: ${{ inputs.mobile_rc_tag || 'latest' }}
        run: node config/scripts/next-release-version.mjs mobile --promote "$RC_TAG"

      - name: Check the mobile rc commit
        id: mobile_commit
        if: inputs.app != 'desktop'
        env:
          RC_TAG: ${{ steps.mobile.outputs.rc_tag }}
        run: |
          set -euo pipefail
          rc_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RC_TAG" --jq .sha)"
          # Why develop head when allowed: a tests- or CI-only merge cuts no rc, so the rc commit would
          # run stale tests against the same app.
          sha="$(GITHUB_OUTPUT=/dev/null node config/scripts/beta-release-scope.mjs --promotion-commit mobile "$rc_sha" "$(git rev-parse HEAD)" | sed -n 's/^sha=//p')"
          [[ "$sha" != "$rc_sha" ]] && echo "Nothing mobile ships changed since $RC_TAG; promoting develop head $sha."
          node config/scripts/verify-release-commit.mjs "$sha" --branch develop --require-checks
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      # Why the newer of the two: both rc commits are on develop, so it contains the other; the full
      # e2e suite runs on it and main moves to it.
      - name: Pick the commit main will point at
        id: target
        env:
          DESKTOP_SHA: ${{ steps.desktop_commit.outputs.sha }}
          MOBILE_SHA: ${{ steps.mobile_commit.outputs.sha }}
        run: |
          set -euo pipefail
          target="${DESKTOP_SHA:-$MOBILE_SHA}"
          if [[ -n "$DESKTOP_SHA" && -n "$MOBILE_SHA" ]]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DESKTOP_SHA...$MOBILE_SHA" --jq .status)"
            [[ "$status" == "ahead" ]] && target="$MOBILE_SHA"
          fi
          echo "sha=$target" >>"$GITHUB_OUTPUT"

      - name: Summary
        env:
          DESKTOP_RC: ${{ steps.desktop.outputs.rc_tag }}
          DESKTOP: ${{ steps.desktop.outputs.tag }}
          DESKTOP_SHA: ${{ steps.desktop_commit.outputs.sha }}
          MOBILE_RC: ${{ steps.mobile.outputs.rc_tag }}
          MOBILE: ${{ steps.mobile.outputs.tag }}
          MOBILE_SHA: ${{ steps.mobile_commit.outputs.sha }}
        run: |
          {
            echo "### Promotion awaiting approval"
            [[ -n "$DESKTOP" ]] && echo "- Desktop: \`$DESKTOP_RC\` → \`$DESKTOP\` at \`$DESKTOP_SHA\`"
            [[ -n "$MOBILE" ]] && echo "- Mobile: \`$MOBILE_RC\` → \`$MOBILE\` at \`$MOBILE_SHA\`"
            true
          } >>"$GITHUB_STEP_SUMMARY"

  # Why a job of its own: a reusable-workflow call cannot take `environment`, so every build waits
  # on this one. Its required reviewers are set in repository settings, not here.
  approve:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Approved
        run: echo "Promotion approved by $GITHUB_TRIGGERING_ACTOR."

  # Why in parallel with the builds: they only stage (desktop draft, APK artifact, internal
  # TestFlight upload), and every *-publish job below waits for this suite to pass.
  e2e:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.target_sha }}
      # Why one retry: a test that fails twice still blocks; one timing hiccup does not.
      retries: '1'

  e2e_wsl:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/windows-wsl-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.target_sha }}
      retries: '1'

  desktop:
    needs: [resolve, approve]
    if: inputs.app != 'mobile'
    permissions:
      contents: write
    uses: ./.github/workflows/dolphin-windows-release.yml
    with:
      version: ${{ needs.resolve.outputs.desktop_version }}
      ref: ${{ needs.resolve.outputs.desktop_sha }}
      prerelease: false
      publish: false
    secrets: inherit

  android:
    needs: [resolve, approve]
    if: inputs.app != 'desktop'
    permissions:
      contents: write
    uses: ./.github/workflows/dolphin-android-release.yml
    with:
      ref: ${{ needs.resolve.outputs.mobile_sha }}
      version: ${{ needs.resolve.outputs.mobile_version }}
      android_version_code: ${{ needs.resolve.outputs.android_version_code }}
      release_tag: ${{ needs.resolve.outputs.mobile_tag }}
      prerelease: false
      publish_github_release: false
    secrets: inherit

  ios:
    needs: [resolve, approve]
    if: inputs.app != 'desktop'
    uses: ./.github/workflows/dolphin-ios-release.yml
    with:
      ref: ${{ needs.resolve.outputs.mobile_sha }}
      release_version: ${{ needs.resolve.outputs.mobile_version }}
    secrets: inherit

  # Why no always()/!failure() on the three publish jobs: a failed e2e or build must skip them.
  desktop-publish:
    needs: [resolve, e2e, e2e_wsl, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.desktop_sha }}
          persist-credentials: false

      - uses: ./.github/actions/publish-desktop-release
        with:
          tag: ${{ needs.desktop.outputs.tag }}
          prerelease: 'false'
          github-token: ${{ github.token }}

  android-publish:
    needs: [resolve, e2e, e2e_wsl, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.mobile_sha }}
          persist-credentials: false

      - name: Download the signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: ${{ runner.temp }}/apk

      - uses: ./.github/actions/publish-android-release
        with:
          apk-path: ${{ runner.temp }}/apk/${{ needs.android.outputs.apk_name }}
          tag: ${{ needs.android.outputs.tag }}
          version: ${{ needs.android.outputs.version }}
          version-code: ${{ needs.android.outputs.version_code }}
          prerelease: 'false'
          target-sha: ${{ needs.resolve.outputs.mobile_sha }}
          github-token: ${{ github.token }}

  # Why distribute_only: the ios job already uploaded this build; this only waits for processing and
  # hands that exact build to the external TestFlight group.
  ios-distribute:
    needs: [resolve, e2e, e2e_wsl, ios]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.mobile_sha }}
          persist-credentials: false

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Distribute to external TestFlight testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ needs.ios.outputs.version }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
        run: bundle exec fastlane ios distribute_testflight version:"$VERSION" build_number:"$BUILD_NUMBER"

  # Why after every publish: main must only ever point at something that was actually published.
  # Why e2e in needs: a failed suite skips the publish jobs, and a skipped job is not a failure.
  fast-forward-main:
    needs: [resolve, e2e, e2e_wsl, desktop-publish, android-publish, ios-distribute]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Why persisted credentials: this job's only write is the push below.
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: develop
          fetch-depth: 0

      # Why the newest of the two: both rc commits are on develop, so one contains the other.
      - name: Move main to the promoted commit
        env:
          DESKTOP_SHA: ${{ needs.resolve.outputs.desktop_sha }}
          MOBILE_SHA: ${{ needs.resolve.outputs.mobile_sha }}
        run: |
          set -euo pipefail
          target="${DESKTOP_SHA:-$MOBILE_SHA}"
          if [[ -n "$MOBILE_SHA" ]] && git merge-base --is-ancestor "$target" "$MOBILE_SHA"; then
            target="$MOBILE_SHA"
          fi
          if git merge-base --is-ancestor "$target" origin/main; then
            echo "main already contains $target; nothing to move."
            exit 0
          fi
          # Why a merge when main is not an ancestor: a sync PR merged into main leaves a merge commit
          # develop lacks, and main must keep moving without rewriting history.
          new_main="$target"
          if ! git merge-base --is-ancestor origin/main "$target"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --quiet --detach origin/main
            git merge --no-ff --no-edit -m "release: move main to $target" "$target"
            new_main="$(git rev-parse HEAD)"
          fi
          if git push origin "$new_main:refs/heads/main" 2>push.log; then
            echo "### main moved to \`$target\`" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat push.log >&2
          # Why a warning: GITHUB_TOKEN can never hold the `workflows` permission, so a range that edits
          # .github/workflows is always refused. The release is published; main is moved by a PR merged
          # with the Claude GitHub App, which has that permission.
          if grep -q 'without `workflows` permission' push.log; then
            echo "::warning::The release IS published. main stays behind $target because the range edits .github/workflows, which GITHUB_TOKEN may not push. Merge a PR from a branch at $target into main (docs/reference/release-process.md)."
            echo "### main NOT moved: the range edits workflows; merge a PR from \`$target\` into main" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::The release IS published, but main was not moved to $target (push rejected: branch protection blocks github-actions?). Merge a PR from a branch at $target into main."
          exit 1
