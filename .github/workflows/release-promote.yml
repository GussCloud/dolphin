name: Release Promote

# Promotes a published beta to the official release; docs/reference/release-process.md is the
# operator guide. After approval in the `production` environment it rebuilds THE SAME COMMIT the rc
# tag points at, versioned X.Y.Z. Nothing is published until the full e2e suite is green on that
# commit: the run E2E develop already made of it counts, otherwise the suite runs here.
# Desktop: vX.Y.Z, the latest stable GitHub release the in-app updater serves.
# Mobile: APK as mobile-android-vX.Y.Z (and mobile-android-latest), and the iOS build the beta
# uploaded (compiled again only when that one cannot be used) distributed to the external
# TestFlight group. App Store review submission stays manual.
# Once published, main is moved to the promoted commit: main is what was released.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to promote
        required: true
        default: both
        type: choice
        options:
          - desktop
          - mobile
          - both
      desktop_rc_tag:
        description: Desktop rc tag to promote, e.g. v0.2.56-rc.2 (latest = newest published rc)
        required: false
        default: latest
        type: string
      mobile_rc_tag:
        description: Mobile rc tag to promote, e.g. mobile-android-v0.0.66-rc.1 (latest = newest published rc)
        required: false
        default: latest
        type: string
      force_e2e:
        description: Run the e2e suite here even when E2E develop already passed on this commit
        required: false
        default: false
        type: boolean
      rebuild_ios:
        description: Compile the iOS build again instead of distributing the one the beta uploaded
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-promote
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'GussCloud/dolphin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Why actions: the green-run lookup reads E2E develop's runs and their record artifact.
    permissions:
      contents: read
      actions: read
    outputs:
      e2e_green_run: ${{ steps.e2e_green.outputs.url }}
      ios_beta_build: ${{ steps.ios_build.outputs.build_number }}
      desktop_version: ${{ steps.desktop.outputs.version }}
      desktop_sha: ${{ steps.desktop_commit.outputs.sha }}
      mobile_version: ${{ steps.mobile.outputs.marketing_version }}
      mobile_tag: ${{ steps.mobile.outputs.tag }}
      android_version_code: ${{ steps.mobile.outputs.android_version_code }}
      mobile_sha: ${{ steps.mobile_commit.outputs.sha }}
      target_sha: ${{ steps.target.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Why full history: promotion-commit diffs the rc commit against develop head.
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the desktop release
        id: desktop
        if: inputs.app != 'mobile'
        env:
          RC_TAG: ${{ inputs.desktop_rc_tag || 'latest' }}
        run: node config/scripts/next-release-version.mjs desktop --promote "$RC_TAG"

      # Why the PR's checks: the rc was cut without them, and promote is the gate that requires them.
      - name: Check the desktop rc commit
        id: desktop_commit
        if: inputs.app != 'mobile'
        env:
          RC_TAG: ${{ steps.desktop.outputs.rc_tag }}
        run: |
          set -euo pipefail
          rc_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RC_TAG" --jq .sha)"
          # Why develop head when allowed: a tests- or CI-only merge cuts no rc, so the rc commit would
          # run stale tests against the same app.
          sha="$(GITHUB_OUTPUT=/dev/null node config/scripts/beta-release-scope.mjs --promotion-commit desktop "$rc_sha" "$(git rev-parse HEAD)" | sed -n 's/^sha=//p')"
          [[ "$sha" != "$rc_sha" ]] && echo "Nothing desktop ships changed since $RC_TAG; promoting develop head $sha."
          node config/scripts/verify-release-commit.mjs "$sha" --branch develop --require-checks
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Resolve the mobile release
        id: mobile
        if: inputs.app != 'desktop'
        env:
          RC_TAG: ${{ inputs.mobile_rc_tag || 'latest' }}
        run: node config/scripts/next-release-version.mjs mobile --promote "$RC_TAG"

      - name: Check the mobile rc commit
        id: mobile_commit
        if: inputs.app != 'desktop'
        env:
          RC_TAG: ${{ steps.mobile.outputs.rc_tag }}
        run: |
          set -euo pipefail
          rc_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RC_TAG" --jq .sha)"
          # Why develop head when allowed: a tests- or CI-only merge cuts no rc, so the rc commit would
          # run stale tests against the same app.
          sha="$(GITHUB_OUTPUT=/dev/null node config/scripts/beta-release-scope.mjs --promotion-commit mobile "$rc_sha" "$(git rev-parse HEAD)" | sed -n 's/^sha=//p')"
          [[ "$sha" != "$rc_sha" ]] && echo "Nothing mobile ships changed since $RC_TAG; promoting develop head $sha."
          node config/scripts/verify-release-commit.mjs "$sha" --branch develop --require-checks
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "rc_sha=$rc_sha" >>"$GITHUB_OUTPUT"

      # Why the rc's build even when develop head is promoted: head is only promoted when nothing
      # mobile ships changed since the rc, so the rc's binary is the same app.
      # Why a missing record is not an error: the ios job then compiles the build as before.
      - name: Find the TestFlight build the beta uploaded
        id: ios_build
        if: ${{ inputs.app != 'desktop' && !inputs.rebuild_ios }}
        env:
          RC_TAG: ${{ steps.mobile.outputs.rc_tag }}
          RC_SHA: ${{ steps.mobile_commit.outputs.rc_sha }}
          VERSION: ${{ steps.mobile.outputs.marketing_version }}
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/ios-record/ios-testflight-build.json"
          if gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --pattern ios-testflight-build.json --dir "$RUNNER_TEMP/ios-record" 2>/dev/null; then
            node config/scripts/ios-beta-build-record.mjs read "$record" --version "$VERSION" --sha "$RC_SHA"
          else
            echo "$RC_TAG carries no TestFlight build record; the iOS build will be compiled."
          fi

      # Why the newer of the two: both rc commits are on develop, so it contains the other; the full
      # e2e suite runs on it and main moves to it.
      - name: Pick the commit main will point at
        id: target
        env:
          DESKTOP_SHA: ${{ steps.desktop_commit.outputs.sha }}
          MOBILE_SHA: ${{ steps.mobile_commit.outputs.sha }}
        run: |
          set -euo pipefail
          target="${DESKTOP_SHA:-$MOBILE_SHA}"
          if [[ -n "$DESKTOP_SHA" && -n "$MOBILE_SHA" ]]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DESKTOP_SHA...$MOBILE_SHA" --jq .status)"
            [[ "$status" == "ahead" ]] && target="$MOBILE_SHA"
          fi
          echo "sha=$target" >>"$GITHUB_OUTPUT"

      # Why reuse it: E2E develop runs this same suite, with the same retry, on every merge, so a
      # second run on the same commit proves nothing new and holds 14 runners for ~15 minutes.
      - name: Look for an E2E develop run that already passed on this commit
        id: e2e_green
        if: ${{ !inputs.force_e2e }}
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: node config/scripts/green-e2e-develop-run.mjs "$SHA"

      - name: Summary
        env:
          E2E_GREEN_RUN: ${{ steps.e2e_green.outputs.url }}
          IOS_BETA_BUILD: ${{ steps.ios_build.outputs.build_number }}
          DESKTOP_RC: ${{ steps.desktop.outputs.rc_tag }}
          DESKTOP: ${{ steps.desktop.outputs.tag }}
          DESKTOP_SHA: ${{ steps.desktop_commit.outputs.sha }}
          MOBILE_RC: ${{ steps.mobile.outputs.rc_tag }}
          MOBILE: ${{ steps.mobile.outputs.tag }}
          MOBILE_SHA: ${{ steps.mobile_commit.outputs.sha }}
        run: |
          {
            echo "### Promotion awaiting approval"
            [[ -n "$DESKTOP" ]] && echo "- Desktop: \`$DESKTOP_RC\` → \`$DESKTOP\` at \`$DESKTOP_SHA\`"
            [[ -n "$MOBILE" ]] && echo "- Mobile: \`$MOBILE_RC\` → \`$MOBILE\` at \`$MOBILE_SHA\`"
            [[ -n "$IOS_BETA_BUILD" ]] && echo "- iOS: distributing the beta's TestFlight build $IOS_BETA_BUILD if it is still available"
            if [[ -n "$E2E_GREEN_RUN" ]]; then
              echo "- e2e: already green on this commit ($E2E_GREEN_RUN); not run again"
            else
              echo "- e2e: the full suite runs in this promote"
            fi
            true
          } >>"$GITHUB_STEP_SUMMARY"

  # Why a job of its own: a reusable-workflow call cannot take `environment`, so every build waits
  # on this one. Its required reviewers are set in repository settings, not here.
  approve:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Approved
        run: echo "Promotion approved by $GITHUB_TRIGGERING_ACTOR."

  # Why in parallel with the builds: they only stage (desktop draft, APK artifact, internal
  # TestFlight upload), and every *-publish job below waits for e2e-gate.
  # Why skipped with a green run: resolve found E2E develop's passing run of this exact commit.
  e2e:
    needs: resolve
    if: needs.resolve.outputs.e2e_green_run == ''
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.target_sha }}
      # Why one retry: a test that fails twice still blocks; one timing hiccup does not.
      retries: '1'

  e2e_wsl:
    needs: resolve
    if: needs.resolve.outputs.e2e_green_run == ''
    permissions:
      contents: read
    uses: ./.github/workflows/windows-wsl-e2e.yml
    with:
      ref: ${{ needs.resolve.outputs.target_sha }}
      retries: '1'

  # Why a job of its own: the suite is either run here or already proven, and a skipped job makes
  # every job that needs it skip too, so the publish jobs read this one verdict instead.
  e2e-gate:
    needs: [resolve, e2e, e2e_wsl]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a green e2e suite on the promoted commit
        env:
          GREEN_RUN: ${{ needs.resolve.outputs.e2e_green_run }}
          SUITE: ${{ needs.e2e.result }}
          WSL: ${{ needs.e2e_wsl.result }}
        run: |
          set -euo pipefail
          if [[ "$SUITE" == success && "$WSL" == success ]]; then
            echo "The full suite passed in this run."
          elif [[ -n "$GREEN_RUN" && "$SUITE" == skipped && "$WSL" == skipped ]]; then
            echo "The full suite already passed on this commit: $GREEN_RUN"
          else
            echo "::error::No green e2e suite for the promoted commit (suite $SUITE, WSL $WSL)."
            exit 1
          fi

  desktop:
    needs: [resolve, approve]
    if: inputs.app != 'mobile'
    permissions:
      contents: write
    uses: ./.github/workflows/dolphin-windows-release.yml
    with:
      version: ${{ needs.resolve.outputs.desktop_version }}
      ref: ${{ needs.resolve.outputs.desktop_sha }}
      prerelease: false
      publish: false
    secrets: inherit

  android:
    needs: [resolve, approve]
    if: inputs.app != 'desktop'
    permissions:
      contents: write
    uses: ./.github/workflows/dolphin-android-release.yml
    with:
      ref: ${{ needs.resolve.outputs.mobile_sha }}
      version: ${{ needs.resolve.outputs.mobile_version }}
      android_version_code: ${{ needs.resolve.outputs.android_version_code }}
      release_tag: ${{ needs.resolve.outputs.mobile_tag }}
      prerelease: false
      publish_github_release: false
    secrets: inherit

  # Why before the build: the beta's build may have expired or failed processing since; only a
  # build TestFlight still holds is distributed, anything else falls back to compiling one.
  ios-reuse:
    needs: [resolve, approve]
    if: inputs.app != 'desktop' && needs.resolve.outputs.ios_beta_build != ''
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      build_number: ${{ steps.verify.outcome == 'success' && needs.resolve.outputs.ios_beta_build || '' }}
    env:
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.mobile_sha }}
          persist-credentials: false

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      # Why continue-on-error: a build that cannot be reused is not a failed promote.
      - name: Check the beta's build is still in TestFlight
        id: verify
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ needs.resolve.outputs.mobile_version }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.ios_beta_build }}
        run: bundle exec fastlane ios verify_testflight_build version:"$VERSION" build_number:"$BUILD_NUMBER"

  # Why !cancelled(): ios-reuse is skipped when the beta left no record, and a skipped need would
  # otherwise skip this build too.
  ios:
    needs: [resolve, approve, ios-reuse]
    if: ${{ !cancelled() && needs.approve.result == 'success' && inputs.app != 'desktop' && needs.ios-reuse.outputs.build_number == '' }}
    uses: ./.github/workflows/dolphin-ios-release.yml
    with:
      ref: ${{ needs.resolve.outputs.mobile_sha }}
      release_version: ${{ needs.resolve.outputs.mobile_version }}
    secrets: inherit

  # Why each publish job names every result it depends on: e2e and ios may be skipped on purpose, so
  # the default "every need succeeded" no longer holds, and a failed gate or build must still skip.
  desktop-publish:
    needs: [resolve, approve, e2e-gate, desktop]
    if: ${{ !cancelled() && needs.approve.result == 'success' && needs.e2e-gate.result == 'success' && needs.desktop.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.desktop_sha }}
          persist-credentials: false

      - uses: ./.github/actions/publish-desktop-release
        with:
          tag: ${{ needs.desktop.outputs.tag }}
          prerelease: 'false'
          github-token: ${{ github.token }}

  android-publish:
    needs: [resolve, approve, e2e-gate, android]
    if: ${{ !cancelled() && needs.approve.result == 'success' && needs.e2e-gate.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.mobile_sha }}
          persist-credentials: false

      - name: Download the signed APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.android.outputs.artifact }}
          path: ${{ runner.temp }}/apk

      - uses: ./.github/actions/publish-android-release
        with:
          apk-path: ${{ runner.temp }}/apk/${{ needs.android.outputs.apk_name }}
          tag: ${{ needs.android.outputs.tag }}
          version: ${{ needs.android.outputs.version }}
          version-code: ${{ needs.android.outputs.version_code }}
          prerelease: 'false'
          target-sha: ${{ needs.resolve.outputs.mobile_sha }}
          github-token: ${{ github.token }}

  # Why distribute_only: the build is already uploaded, by the beta (ios-reuse) or by the ios job;
  # this only waits for processing and hands that exact build to the external TestFlight group.
  ios-distribute:
    needs: [resolve, approve, e2e-gate, ios-reuse, ios]
    if: >-
      ${{ !cancelled() && needs.approve.result == 'success' && needs.e2e-gate.result == 'success' &&
      (needs.ios.result == 'success' ||
      (needs.ios.result == 'skipped' && needs.ios-reuse.outputs.build_number != '')) }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUNDLE_FROZEN: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.mobile_sha }}
          persist-credentials: false

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile

      - name: Distribute to external TestFlight testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ needs.ios.outputs.version || needs.resolve.outputs.mobile_version }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number || needs.ios-reuse.outputs.build_number }}
        run: bundle exec fastlane ios distribute_testflight version:"$VERSION" build_number:"$BUILD_NUMBER"

  # Why after every publish: main must only ever point at something that was actually published.
  # Why each app's publish result is named: a publish job skipped for any reason is not a failure,
  # so "nothing failed" alone would move main past an app that was never published.
  fast-forward-main:
    needs: [resolve, e2e-gate, desktop-publish, android-publish, ios-distribute]
    if: >-
      ${{ !cancelled() && needs.e2e-gate.result == 'success' &&
      (inputs.app == 'mobile' || needs.desktop-publish.result == 'success') &&
      (inputs.app == 'desktop' ||
      (needs.android-publish.result == 'success' && needs.ios-distribute.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Why persisted credentials: this job's only write is the push below.
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      # Why the newest of the two: both rc commits are on develop, so one contains the other.
      - name: Move main to the promoted commit
        env:
          DESKTOP_SHA: ${{ needs.resolve.outputs.desktop_sha }}
          MOBILE_SHA: ${{ needs.resolve.outputs.mobile_sha }}
        run: |
          set -euo pipefail
          target="${DESKTOP_SHA:-$MOBILE_SHA}"
          if [[ -n "$MOBILE_SHA" ]] && git merge-base --is-ancestor "$target" "$MOBILE_SHA"; then
            target="$MOBILE_SHA"
          fi
          if git merge-base --is-ancestor "$target" origin/main; then
            echo "main already contains $target; nothing to move."
            exit 0
          fi
          # Why a merge when main is not an ancestor: a sync PR merged into main leaves a merge commit
          # develop lacks, and main must keep moving without rewriting history.
          new_main="$target"
          if ! git merge-base --is-ancestor origin/main "$target"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --quiet --detach origin/main
            git merge --no-ff --no-edit -m "release: move main to $target" "$target"
            new_main="$(git rev-parse HEAD)"
          fi
          if git push origin "$new_main:refs/heads/main" 2>push.log; then
            echo "### main moved to \`$target\`" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat push.log >&2
          # Why a warning: GITHUB_TOKEN can never hold the `workflows` permission, so a range that edits
          # .github/workflows is always refused. The release is published; main is moved by a PR merged
          # with the Claude GitHub App, which has that permission.
          if grep -q 'without `workflows` permission' push.log; then
            echo "::warning::The release IS published. main stays behind $target because the range edits .github/workflows, which GITHUB_TOKEN may not push. Merge a PR from a branch at $target into main (docs/reference/release-process.md)."
            echo "### main NOT moved: the range edits workflows; merge a PR from \`$target\` into main" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::The release IS published, but main was not moved to $target (push rejected: branch protection blocks github-actions?). Merge a PR from a branch at $target into main."
          exit 1
