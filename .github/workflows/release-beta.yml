name: Release Beta

# Cuts a beta from a commit on main; docs/reference/release-process.md is the operator guide.
# Desktop: vX.Y.Z-rc.N, a GitHub prerelease the in-app updater serves to the RC channel.
# Mobile: an internal TestFlight build of X.Y.Z plus the APK as prerelease mobile-android-vX.Y.Z-rc.N.
# Versions are computed here and stamped into each build's checkout; nothing is committed to main.

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to release
        required: true
        default: both
        type: choice
        options:
          - desktop
          - mobile
          - both
      ref:
        description: 'Commit SHA or ref on main to build (default: the tip of main)'
        required: false
        type: string
      bump:
        description: How far past the last stable release the beta line starts
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# Why one group: two concurrent cuts would compute the same rc number.
concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'GussCloud/dolphin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      desktop_version: ${{ steps.desktop.outputs.version }}
      mobile_version: ${{ steps.mobile.outputs.marketing_version }}
      mobile_tag: ${{ steps.mobile.outputs.tag }}
      android_version_code: ${{ steps.mobile.outputs.android_version_code }}
    env:
      GH_TOKEN: ${{ github.token }}
      APP: ${{ inputs.app }}
      BUMP: ${{ inputs.bump }}
    steps:
      # Why full history: release-rc-history.mjs reads rc tags and release commits from git.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the commit
        id: commit
        env:
          REF: ${{ inputs.ref || 'origin/main' }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "$REF^{commit}")"
          node config/scripts/verify-release-commit.mjs "$sha"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Compute the desktop beta version
        id: desktop
        if: inputs.app != 'mobile'
        run: node config/scripts/next-release-version.mjs desktop --bump "$BUMP"

      - name: Compute the mobile beta version
        id: mobile
        if: inputs.app != 'desktop'
        run: node config/scripts/next-release-version.mjs mobile --bump "$BUMP"

      - name: Summary
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          DESKTOP: ${{ steps.desktop.outputs.tag }}
          MOBILE: ${{ steps.mobile.outputs.tag }}
          CODE: ${{ steps.mobile.outputs.android_version_code }}
        run: |
          {
            echo "### Beta from \`$SHA\`"
            [[ -n "$DESKTOP" ]] && echo "- Desktop: \`$DESKTOP\` (prerelease, RC channel)"
            [[ -n "$MOBILE" ]] && echo "- Mobile: \`$MOBILE\` (Android versionCode $CODE), iOS TestFlight internal"
            true
          } >>"$GITHUB_STEP_SUMMARY"

  desktop:
    needs: resolve
    if: inputs.app != 'mobile'
    permissions:
      contents: write
    uses: ./.github/workflows/dolphin-windows-release.yml
    with:
      version: ${{ needs.resolve.outputs.desktop_version }}
      ref: ${{ needs.resolve.outputs.sha }}
      prerelease: true
    secrets: inherit

  android:
    needs: resolve
    if: inputs.app != 'desktop'
    permissions:
      contents: write
    uses: ./.github/workflows/dolphin-android-release.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.mobile_version }}
      android_version_code: ${{ needs.resolve.outputs.android_version_code }}
      release_tag: ${{ needs.resolve.outputs.mobile_tag }}
      prerelease: true
    secrets: inherit

  ios:
    needs: resolve
    if: inputs.app != 'desktop'
    uses: ./.github/workflows/dolphin-ios-release.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      release_version: ${{ needs.resolve.outputs.mobile_version }}
    secrets: inherit
