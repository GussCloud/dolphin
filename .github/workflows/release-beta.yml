name: Release Beta

# Cuts a beta from a commit on develop; docs/reference/release-process.md is the operator guide.
# Every push to develop (a merged PR) cuts one for the apps that changed since their last release
# tag (beta-release-scope.mjs); a manual run picks the app, commit and bump.
# Desktop: vX.Y.Z-rc.N, a GitHub prerelease the in-app updater serves to the RC channel.
# Mobile: an internal TestFlight build of X.Y.Z plus the APK as prerelease mobile-android-vX.Y.Z-rc.N.
# Versions are computed here and stamped into each build's checkout; nothing is committed.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      app:
        description: Which app to release
        required: true
        default: both
        type: choice
        options:
          - desktop
          - mobile
          - both
      ref:
        description: 'Commit SHA or ref on develop to build (default: the tip of develop)'
        required: false
        type: string
      bump:
        description: How far past the last stable release the beta line starts
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# Why one group: two concurrent cuts would compute the same rc number. A burst of merges waits
# here; GitHub keeps only the newest pending run, which is safe because scope and rc are counted
# from the last release tag, so the newest commit's beta carries every skipped merge.
concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'GussCloud/dolphin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      desktop: ${{ steps.scope.outputs.desktop }}
      mobile: ${{ steps.scope.outputs.mobile }}
      desktop_version: ${{ steps.desktop.outputs.version }}
      mobile_version: ${{ steps.mobile.outputs.marketing_version }}
      mobile_tag: ${{ steps.mobile.outputs.tag }}
      android_version_code: ${{ steps.mobile.outputs.android_version_code }}
    env:
      GH_TOKEN: ${{ github.token }}
      APP: ${{ inputs.app }}
      BUMP: ${{ inputs.bump || 'patch' }}
    steps:
      # Why full history and tags: the scope and rc numbering read release tags and history from git.
      - name: Checkout develop
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Why github.sha on push: later merges may already be on develop's tip; build the pushed one.
      - name: Resolve the commit
        id: commit
        env:
          REF: ${{ github.event_name == 'push' && github.sha || inputs.ref || 'origin/develop' }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "$REF^{commit}")"
          node config/scripts/verify-release-commit.mjs "$sha" --branch develop
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Decide which apps get a beta
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push ]]; then
            node config/scripts/beta-release-scope.mjs "$SHA"
          else
            node config/scripts/beta-release-scope.mjs --app "$APP"
          fi

      - name: Compute the desktop beta version
        id: desktop
        if: steps.scope.outputs.desktop == 'true'
        run: node config/scripts/next-release-version.mjs desktop --bump "$BUMP"

      - name: Compute the mobile beta version
        id: mobile
        if: steps.scope.outputs.mobile == 'true'
        run: node config/scripts/next-release-version.mjs mobile --bump "$BUMP"

      - name: Summary
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          DESKTOP: ${{ steps.desktop.outputs.tag }}
          MOBILE: ${{ steps.mobile.outputs.tag }}
          CODE: ${{ steps.mobile.outputs.android_version_code }}
        run: |
          {
            echo "### Beta from \`$SHA\`"
            [[ -n "$DESKTOP" ]] && echo "- Desktop: \`$DESKTOP\` (prerelease, RC channel)"
            [[ -n "$MOBILE" ]] && echo "- Mobile: \`$MOBILE\` (Android versionCode $CODE), iOS TestFlight internal"
            [[ -z "$DESKTOP$MOBILE" ]] && echo "No beta needed: only docs or tests changed since the last release of each app."
            true
          } >>"$GITHUB_STEP_SUMMARY"

  desktop:
    needs: resolve
    if: needs.resolve.outputs.desktop == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/dolphin-windows-release.yml
    with:
      version: ${{ needs.resolve.outputs.desktop_version }}
      ref: ${{ needs.resolve.outputs.sha }}
      prerelease: true
    secrets: inherit

  android:
    needs: resolve
    if: needs.resolve.outputs.mobile == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/dolphin-android-release.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      version: ${{ needs.resolve.outputs.mobile_version }}
      android_version_code: ${{ needs.resolve.outputs.android_version_code }}
      release_tag: ${{ needs.resolve.outputs.mobile_tag }}
      prerelease: true
    secrets: inherit

  ios:
    needs: resolve
    if: needs.resolve.outputs.mobile == 'true'
    uses: ./.github/workflows/dolphin-ios-release.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      release_version: ${{ needs.resolve.outputs.mobile_version }}
    secrets: inherit

  # Why: a promote of this rc hands this exact TestFlight build to external testers instead of
  # compiling the same commit again (release-promote.yml, ios-reuse).
  ios-record:
    needs: [resolve, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Record the TestFlight build on the mobile rc release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.mobile_tag }}
          VERSION: ${{ needs.ios.outputs.version }}
          BUILD_NUMBER: ${{ needs.ios.outputs.build_number }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          record="$RUNNER_TEMP/ios-testflight-build.json"
          node config/scripts/ios-beta-build-record.mjs write "$VERSION" "$BUILD_NUMBER" "$SHA" "$record"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$record"
